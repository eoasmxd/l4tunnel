[common]
# 服务端监听地址与端口
bind_addr = 0.0.0.0
bind_port = 3007

# 接入认证密码（留空表示不启用密码校验）
token = 12345678

# 日志级别：trace, debug, info, warn, error
log_level = info

# 代理对外监听绑定的 IP，默认同 bind_addr
# proxy_bind_addr = 0.0.0.0

# 自定义 TLS 证书文件路径（若未配置则在内存中自动生成自签名证书）
# tls_cert_file = ./server.crt
# tls_key_file = ./server.key
