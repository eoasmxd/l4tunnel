[common]
server_addr = 127.0.0.1
server_port = 3007

# 认证密码，需与服务端 token 保持一致
# Authentication token, must match the server token
token = 12345678

# 日志级别：trace, debug, info, warn, error
# Log level: trace, debug, info, warn, error
log_level = info

# 预建连接池数量
# Pre-established connection pool size
pool_count = 5

# 是否校验服务端 TLS 证书（使用系统默认受信任 CA，默认 false）
# Whether to verify the server TLS certificate using system default trusted CAs (default: false)
# tls_verify = true

[ssh]
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000

# 四层 TCP 健康检查（默认间隔 10s，超时 3s）
# Layer-4 TCP health check (default interval: 10s, timeout: 3s)
# health_check = true
